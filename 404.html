<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
  </style>
  <script>
    // 1. ADD YOUR SHORT LINKS HERE
    // Format: "string": "https://destination-url.com"
    const redirects = {
      "gh": "https://github.com/tristanjh",
      "discord": "https://discord.gg/yourinvite",
      "portfolio": "https://tristanjh.me",
      "twitter": "https://twitter.com/yourhandle"
    };

    // 2. REDIRECT LOGIC
    (function() {
      const path = window.location.pathname;
      const segments = path.split('/').filter(Boolean);
      const lIndex = segments.indexOf('l');

      // Checks if the path contains "/l/[string]"
      if (lIndex !== -1 && segments[lIndex + 1]) {
        const slug = segments[lIndex + 1].toLowerCase();
        const destination = redirects[slug];

        if (destination) {
          // window.location.replace prevents this page from clogging browser history
          window.location.replace(destination);
          return;
        }
      }

      // Fallback message if the short link doesn't exist
      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('status').innerText = "404 - Link not found.";
      });
    })();
  </script>
</head>
<body>
  <p id="status">Redirecting...</p>
</body>
</html>
